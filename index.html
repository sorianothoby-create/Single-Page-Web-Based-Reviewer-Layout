
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade 12 Reviewer</title>

    <meta name="description"
          content="A web-based Grade 12 reviewer for students. Review lessons, subjects, and study materials online.">

    <meta name="keywords"
          content="Grade 12 reviewer, Grade 12 study reviewer, online reviewer, web-based reviewer, Philippines">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Grade 12 Reviewer</h1>
        <p>Single-Page Web-Based Reviewer</p>
    </header>

    <!-- SUBJECTS PAGE -->

    <main id="subjects">

        <h2>Subjects</h2>

        <input
            type="text"
            id="searchBar"
            placeholder="Search subjects or lessons..."
            oninput="searchContent()"
            autocomplete="off"
        >

        <div id="searchResults"></div>

        <div id="subjectButtons"></div>

    </main>

    <!-- SUBJECT LESSONS PAGE -->

    <main id="subjectPage" class="page">

        <h2 id="subjectTitle"></h2>

        <div id="lessonButtons"></div>

        <button onclick="showSubjects()">
            ← Back to Subjects
        </button>

    </main>

    <!-- LESSON CONTENT PAGE -->

    <main id="lessonPage" class="lesson">

        <h2 id="lessonTitle"></h2>

        <div id="lessonContent"></div>

        <button onclick="showSubject(currentSubject)">
            ← Back to Lessons
        </button>

    </main>

    <!-- LOAD LESSON DATA FIRST -->

    <script src="lessons.js"></script>

    <!-- LOAD WEBSITE FUNCTIONS SECOND -->

    <script src="script.js"></script>

</body>

</html>
